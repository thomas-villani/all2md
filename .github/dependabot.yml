version: 2
updates:
  # Monitor GitHub Actions versions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"

  # Monitor Python dependencies
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "python"
    # PyMuPDF 2.x changes PDF output (pymupdf4llm's import flips quad
    # corrections); the move is planned on feat/pymupdf-2. Drop this ignore
    # when that lands.
    ignore:
      - dependency-name: "pymupdf"
        versions: [">=2"]
      - dependency-name: "pymupdf-layout"
        versions: [">=2"]
    # Group dependency updates to reduce PR noise
    groups:
      dev-dependencies:
        patterns:
          - "pytest*"
          - "mypy*"
          - "ruff*"
          - "sphinx*"
          - "types-*"
        update-types:
          - "minor"
          - "patch"
