name: CodeQL Security Analysis

on:
  push:
    branches:
      - main
      - 'release/**'
  # A pull request's base must match, and the ruleset requires CodeQL results on
  # `main` and on `release/**`. Without `release/**` here, a patch PR into a release
  # branch never got a scan and could not merge without bypassing the rules.
  pull_request:
    branches:
      - main
      - 'release/**'
  schedule:
    # Run weekly on Sundays at midnight UTC
    - cron: '0 0 * * 0'

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language:
          - python

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # Use extended security queries for more comprehensive analysis
          queries: security-extended,security-and-quality
          # Use custom config to exclude tests/examples directories
          config-file: .github/codeql-config.yml

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
