name: Release to PyPI

# Primary trigger: the CI workflow completing for a `v*` tag. Gating on the CI
# run means a tag publishes only after lint/type/test/security all pass. We
# can't trigger on the tag push directly (that wouldn't wait for CI), nor on
# the `release: published` event (ci.yml creates that Release with
# GITHUB_TOKEN, and events from GITHUB_TOKEN don't start workflow runs).
# `release: published` is kept for releases made manually in the UI;
# `workflow_dispatch` is the manual re-publish fallback.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v1.0.5)'
        required: true

permissions:
  contents: read
  id-token: write  # Required for PyPI trusted publishing

jobs:
  build-and-publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    # On a CI-completion trigger, publish only when CI succeeded for a pushed
    # version tag. Manual dispatch and UI-release events run unconditionally.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       startsWith(github.event.workflow_run.head_branch, 'v'))

    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          # Resolve the tag from whichever event fired: a published release via
          # github.event.release.tag_name, a manual run via inputs.tag, and a
          # CI-completion run via the upstream run's head_branch (the tag name).
          ref: ${{ github.event.release.tag_name || inputs.tag || github.event.workflow_run.head_branch }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build hatchling

      - name: Verify version matches release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag || github.event.workflow_run.head_branch }}
        run: |
          # Extract version from pyproject.toml
          PROJECT_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          # Extract version from release tag (remove 'v' prefix if present)
          RELEASE_VERSION="${RELEASE_TAG#v}"

          echo "Project version: $PROJECT_VERSION"
          echo "Release version: $RELEASE_VERSION"

          if [ "$PROJECT_VERSION" != "$RELEASE_VERSION" ]; then
            echo "Error: Version mismatch!"
            echo "pyproject.toml version ($PROJECT_VERSION) does not match release tag ($RELEASE_VERSION)"
            exit 1
          fi
          echo "Version check passed!"

      - name: Build package
        run: |
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          print-hash: true
          # Idempotent: if this version is already on PyPI (e.g. a tag push and
          # a manual UI release both fired), skip instead of failing the run.
          skip-existing: true

  publish-mcp-registry:
    name: Publish to the MCP Registry
    # The registry stores metadata only, and it verifies it against PyPI: the
    # package must exist and its README must carry `mcp-name: <server name>`. So
    # this runs after the upload, and waits for PyPI to serve the new version.
    needs: build-and-publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # mcp-publisher login github-oidc
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag || github.event.workflow_run.head_branch }}
      # Pinned like the mcpb CLI in ci.yml: bump deliberately, and update the
      # checksum check below with it.
      MCP_PUBLISHER_VERSION: "1.8.1"
      REGISTRY_API: https://registry.modelcontextprotocol.io/v0

    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Decide whether to publish
        id: decide
        run: |
          # Releases before 1.17 have no server.json, and their CLI has no `mcp`
          # subcommand, so the entry would install a server that cannot start.
          if [ ! -f server.json ]; then
            echo "::notice::$RELEASE_TAG has no server.json; nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          NAME=$(jq -r .name server.json)
          VERSION=$(jq -r .version server.json)
          if [ "$VERSION" != "${RELEASE_TAG#v}" ]; then
            echo "Error: server.json version ($VERSION) does not match tag ($RELEASE_TAG)"
            echo "Run 'bumpversion' to sync it (see [tool.bumpversion] in pyproject.toml)."
            exit 1
          fi
          # Registry versions are immutable, so a re-run (tag push plus a manual
          # UI release, or workflow_dispatch) must skip rather than fail.
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' "$REGISTRY_API/servers/${NAME/\//%2F}/versions/$VERSION")
          if [ "$STATUS" = "200" ]; then
            echo "::notice::$NAME $VERSION is already in the registry; skipping."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Wait for PyPI to serve the release
        if: steps.decide.outputs.publish == 'true'
        env:
          NAME: ${{ steps.decide.outputs.name }}
          VERSION: ${{ steps.decide.outputs.version }}
        run: |
          for attempt in $(seq 1 30); do
            if curl -sf "https://pypi.org/pypi/all2md/$VERSION/json" \
                | jq -r .info.description | grep -q "mcp-name: $NAME"; then
              echo "PyPI serves all2md $VERSION with the ownership marker."
              exit 0
            fi
            echo "Attempt $attempt: not yet; waiting 20s."
            sleep 20
          done
          echo "Error: PyPI never served all2md $VERSION with 'mcp-name: $NAME' in its README."
          exit 1

      - name: Add the .mcpb bundle to the entry
        if: steps.decide.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.decide.outputs.version }}
        run: |
          # ci.yml attaches all2md.mcpb to the release. Its checksum exists only
          # once that build has run, so the entry is completed here, not in git.
          if ! gh release download "$RELEASE_TAG" --pattern all2md.mcpb --dir mcpb-asset; then
            echo "::warning::$RELEASE_TAG has no all2md.mcpb asset; publishing the PyPI package only."
            exit 0
          fi
          SHA256=$(sha256sum mcpb-asset/all2md.mcpb | cut -d' ' -f1)
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/all2md.mcpb"
          jq --arg url "$URL" --arg sha "$SHA256" --arg version "$VERSION" \
            '.packages += [{registryType: "mcpb", identifier: $url, version: $version,
                            fileSha256: $sha, transport: {type: "stdio"}}]' \
            server.json > server.json.tmp
          mv server.json.tmp server.json
          cat server.json

      - name: Install mcp-publisher
        if: steps.decide.outputs.publish == 'true'
        run: |
          BASE="https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}"
          curl -sfLO "$BASE/mcp-publisher_linux_amd64.tar.gz"
          curl -sfLO "$BASE/registry_${MCP_PUBLISHER_VERSION}_checksums.txt"
          sha256sum --check --ignore-missing "registry_${MCP_PUBLISHER_VERSION}_checksums.txt"
          tar xzf mcp-publisher_linux_amd64.tar.gz mcp-publisher

      - name: Publish
        if: steps.decide.outputs.publish == 'true'
        run: |
          ./mcp-publisher validate
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
