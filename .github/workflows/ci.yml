name: CI

on:
  push:
    branches:
      - main
      - 'release/**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - 'release/**'

permissions:
  contents: write  # Required for `gh release create` in the release job

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all,dev]"

      # `benchmarks/` is in scope for all three. It had never been in any gate, and
      # it is now ~2,700 lines of measurement logic -- the corpus, roundtrip, startup
      # and OmniDocBench harnesses whose numbers we treat as evidence. Code that
      # decides whether a release is green should be held to the same standard as the
      # code it scores. It was already clean when it was added here, so nothing was
      # reformatted to make this pass.
      - name: Run Black formatter check
        run: |
          black --check src/ tests/ benchmarks/

      - name: Run Ruff linter
        # --no-fix is belt-and-braces: pyproject no longer sets `fix = true`, and
        # this makes the gate report violations regardless of what the config says.
        # A linter that repairs its findings in the runner and exits 0 is not a gate.
        run: |
          ruff check --no-fix src/ tests/ benchmarks/

      - name: Run MyPy type checker
        run: |
          mypy src/ benchmarks/

  docs:
    name: Build Documentation
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all,dev]"

      - name: Build Sphinx documentation
        run: |
          cd docs
          make html SPHINXOPTS="-W --keep-going"

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all,dev]"

      - name: Run tests with coverage
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: |
          # Tests marked matrix_single exercise parser/renderer logic, which does not
          # vary by interpreter, so four of the five legs would redo identical work.
          # They run on 3.12 — the same leg that uploads coverage, so the reported
          # figure still includes them.
          #
          # The 3.12 leg additionally drops `generative`: the Hypothesis-drawn
          # roundtrip gates are derandomized, so a per-PR run replays a fixed
          # corpus for an answer that only moves when our code does. They run on
          # a schedule instead (fuzz-corpus.yml). This is what took the leg from
          # ~6 min to over 3 hours and made it the critical path for every PR.
          #
          # --durations is cheap and prints the 25 slowest tests, so the next
          # time a leg blows up the log says which test rather than which file.
          ARGS=(tests/ -v --durations=25 --cov=all2md --cov-report=xml --cov-report=term)
          if [ "$PYTHON_VERSION" = "3.12" ]; then
            ARGS+=(-m "not generative")
          else
            ARGS+=(-m "not matrix_single")
          fi
          pytest "${ARGS[@]}"

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  test-windows:
    name: Test (Windows, Python 3.13)
    runs-on: windows-latest

    # Every other job in this file runs on ubuntu-latest, so until now nothing here could
    # see a POSIX-only assumption. `benchmarks/omnidocbench` shipped a cache lock built on
    # `fcntl.flock` that refused to run at all off POSIX: CI was green while the same
    # commit failed 21 tests and produced 4 mypy errors on a Windows checkout. Windows is
    # a supported platform for a library whose users mostly arrive through the CLI, so it
    # gets a leg.
    #
    # One version, not a matrix: what this covers is the OS, and paying five times for it
    # would buy interpreter differences the ubuntu matrix already reports. 3.13 because it
    # is the fastest of the versions we support.
    #
    # It keeps `matrix_single`, which the ubuntu legs drop. That exclusion is sound for its
    # own reason -- parser and renderer logic does not vary by interpreter -- but it does
    # vary by OS: path separators, filename rules, newline translation, and the locale
    # encoding are exactly what those tests touch. `generative` is excluded for the same
    # reason as on 3.12: it is fixed-seed and belongs on a schedule (fuzz-corpus.yml).
    #
    # PYTHONUTF8 is deliberately not set. A Windows user gets the ANSI code page by
    # default on 3.13, so setting it here would hide the encoding failures they would hit.
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all,dev]"

      - name: Run tests
        run: pytest tests/ -v --durations=25 -m "not generative"

  roundtrip:
    name: Roundtrip Fidelity Gate
    runs-on: ubuntu-latest

    # Blocking fidelity gate: Markdown -> AST -> Markdown must survive both oracles
    # (idempotency + mistune HTML-equivalence) over benchmarks/roundtrip's corpus.
    # Single Python version on purpose - fidelity is a property of the renderer, not
    # of the interpreter, so the 5-version matrix would buy nothing for 5x the time.
    # Accepted failures live in EXPECTED_FAILURES in benchmarks/roundtrip/run.py; that
    # list going stale fails the build too, so it can't rot into a silent excuse.
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all,dev]"

      - name: Run roundtrip fidelity benchmark
        run: |
          set -o pipefail
          python -m benchmarks.roundtrip --json roundtrip-results.json | tee roundtrip-table.txt

      # Only on red, so green runs stay quiet but a failure arrives with the diffs
      # already in the log instead of needing a local reproduction.
      - name: Show diffs for failures
        if: failure()
        run: python -m benchmarks.roundtrip --show-diff

      - name: Write summary
        if: always()
        run: |
          {
            echo "## Roundtrip fidelity"
            echo
            echo '```'
            cat roundtrip-table.txt || echo "benchmark did not produce a table"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: roundtrip-results-${{ github.run_number }}
          path: roundtrip-results.json
          if-no-files-found: warn

  startup:
    name: Cold Start Gate
    runs-on: ubuntu-latest

    # Blocking timing gate: cold start must stay within tolerance of the committed
    # baseline in benchmarks/startup_baseline.json. Deliberately coarse - the
    # tolerance is 20% against a measured 7.2% runner-variance floor (see the
    # Startup Runner Variance workflow), so only gross regressions trip it.
    #
    # The sharp instrument for the eager-import scaling bug is
    # tests/unit/test_eager_imports.py, which compares module sets exactly and
    # cannot flake. This job covers what that one structurally cannot see: a slow
    # parser build, a heavy dependency, an algorithmic regression in registration.
    #
    # Runs alone on its runner and is not parallelised for a reason - it is a
    # wall-clock measurement, so competing jobs on the same VM would be noise.
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all,dev]"

      - name: Run cold start gate
        run: |
          set -o pipefail
          python -m benchmarks.startup \
            --repeat 9 \
            --baseline benchmarks/startup_baseline.json \
            --out startup-results.json \
            | tee startup-table.txt

      - name: Write summary
        if: always()
        run: |
          {
            echo "## Cold start"
            echo
            echo '```'
            cat startup-table.txt || echo "benchmark did not produce a table"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: startup-results-${{ github.run_number }}
          path: startup-results.json
          if-no-files-found: warn

  format-benchmarks:
    name: Format Benchmarks
    runs-on: ubuntu-latest

    # Per-format conversion timings over the small fixtures, across the dozen formats
    # the corpus gate does not reach (it covers pdf + eml only). Runs in well under a
    # minute.
    #
    # It gates on conversion, NOT on time. The absolute ceilings this suite used to
    # carry had 11x-231x headroom the first time anyone ran them, and the rest
    # asserted `mean_time > 0`, which is true by construction - so nothing here ever
    # could have failed. What's checked now is that every format still converts, and
    # converts to something rather than to an empty string: deterministic, and
    # unable to flake.
    #
    # The timings are recorded to the artifact and left ungated on purpose, the same
    # stance benchmarks/corpus takes on throughput. These fixtures convert in 5-885
    # ms; gating a 5 ms measurement needs a variance study on these runners first,
    # and measured runner variance is already ~7% before denominator jitter. The
    # artifact is what such a study would be built from.
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all,dev]"

      # --benchmark is required; without it the suite deselects itself entirely.
      - name: Run format benchmarks
        run: |
          set -o pipefail
          pytest tests/performance --benchmark --benchmark-save -q -s \
            | tee format-benchmarks.txt

      - name: Write summary
        if: always()
        run: |
          {
            echo "## Format benchmarks"
            echo
            echo "Recorded, not gated - see the job comment for why."
            echo
            echo '```'
            # -A rather than a sed range: the table opens with its own ==== rule, so
            # a range ending on ==== closes one line after it starts.
            grep -A 30 'BENCHMARK RESULTS SUMMARY' format-benchmarks.txt \
              || echo "benchmark did not produce a table"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: format-benchmarks-${{ github.run_number }}
          path: tests/performance/results/
          if-no-files-found: warn

  quality-gate-action:
    name: Quality Gate Action
    runs-on: ubuntu-latest

    # Dogfoods the action at the repo root (`action.yml`) against our own docs.
    #
    # Two steps, because they cover different things and neither covers the other:
    #
    #   1. `uses: ./` exercises the composite YAML end to end -- inputs, version
    #      resolution, install. It installs all2md from PyPI, so it says nothing
    #      about *this* PR's scoring; its threshold is deliberately slack so a
    #      published-vs-branch difference cannot make it flake. It answers "does
    #      the action run at all", which the unit tests cannot.
    #   2. The direct script run scores with the branch's code (editable install)
    #      at the real thresholds. This is the ratchet.
    #
    # The thresholds in step 2 are measured floors, not round numbers. README.md
    # used to be the worst at 97 fidelity, because 11 raw HTML blocks re-parsed as
    # paragraphs; #178 made pass-through the markdown renderer's default and all
    # six tracked root files now score 100 on both axes. Re-recorded here as 100.
    # So both gates pass with *zero* headroom, which is the point. Re-record them
    # deliberately if they move; do not nudge them down to make a build green. A
    # threshold well below the real floor is the failure this whole batch kept
    # finding -- a gate that passes because it cannot fail.
    #
    # Zero headroom at 100 means any regression fails, by design. The closest file
    # to the edge is CHANGELOG.md, whose round trip differs by 5 "words" out of
    # ~25,000 -- all of them runs of table-delimiter dashes that the renderer
    # re-widths, not prose. That rounds to 100 with room to spare; if this gate
    # ever fails on CHANGELOG.md, check whether the loss is dashes or sentences
    # before assuming the threshold is wrong.
    #
    # `*.md` matches six tracked files here. Running the same command locally
    # scores nine, because CLAUDE.md, AGENTS.md and todo.md are gitignored -- so a
    # local run can show a different floor than CI without either being wrong.
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Verify the action's wiring
        uses: ./
        with:
          paths: |
            README.md
            CONTRIBUTING.md
          roundtrip-fail-under: 90
          all2md-version: latest

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all,dev]"

      - name: Gate this branch against our own docs
        run: |
          python scripts/action_gate.py run \
            --paths '*.md' \
            --roundtrip-fail-under 100 \
            --report-fail-under 100

  security-semgrep:
    name: Security Scan (Semgrep)
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      # `semgrep/semgrep-action@v1` was replaced because it had been reporting success
      # without scanning anything since 2026-07-01. Its pinned semgrep 1.36.0 cannot parse
      # registry rules carrying `severity: MEDIUM`, so every run died on
      # `ValueError: invalid rule severity value: MEDIUM` and the wrapper swallowed the
      # non-zero exit. The last real scan was 2026-06-30 (`Found 0 findings from 1059
      # rules`, 57s); every run after it finished in 11-16s having read no rules, and
      # v1.11.0 shipped through a required check that could not fail.
      #
      # `SEMGREP_APP_TOKEN` was also never set -- `gh secret list` has only CODECOV_TOKEN --
      # so the removed comment's reasoning about a cloud ruleset described a
      # token-authenticated scan this job has never performed. Running the CLI directly on
      # the pinned registry ruleset needs no token, and `p/python` plus `p/security-audit`
      # is the community equivalent of what `config: auto` resolved to unauthenticated.
      - name: Install Semgrep
        run: pip install semgrep==1.145.0

      # A positive control, and it runs BEFORE the real scan so a broken ruleset fails the
      # job on its own terms rather than being reported as a clean repository. The canary is
      # written at run time instead of committed, so nothing else in the repo scans it and
      # no suppression comment is needed anywhere.
      #
      # The logic is inverted on purpose: `--error` exits 1 when there are findings, so the
      # control PASSES when semgrep exits non-zero. A semgrep that loads no rules exits 0
      # here and fails the step -- which is exactly what the previous six weeks of runs
      # would have done.
      - name: Prove the scanner can still find something
        run: |
          cat > "${RUNNER_TEMP}/canary.py" <<'PY'
          import subprocess


          def run_it(user_input):
              # p/python: dangerous-subprocess-use-audit
              subprocess.call(user_input, shell=True)
          PY
          if semgrep scan --config p/python --config p/security-audit \
               --error --metrics off --quiet "${RUNNER_TEMP}/canary.py"; then
            echo "::error::Semgrep reported no findings on a deliberately vulnerable file."
            echo "::error::The ruleset is not loading; this gate would pass on anything."
            exit 1
          fi
          echo "control passed: the ruleset loads and the scanner can fail"

      # Scoped to `src/`, which is the only thing the wheel ships. The first working run
      # of this job reported 18 findings; 16 of them are in `tests/`, `benchmarks/` and
      # `stubs/` -- e2e tests calling `urlopen` against their own localhost server, the
      # benchmark corpus fetchers parsing digest-pinned XML, an MD5 in a fixture
      # generator, and a type stub that never executes. None of that reaches a user, and
      # blocking releases on it would train everyone to ignore this job.
      #
      # They are not swept under the rug: they are triaged in the follow-up issue linked
      # from the PR, and `defusedxml` for the JATS parser is worth doing on its own merits.
      # Widening this back to `.` is a deliberate decision to make, not a default to drift
      # into.
      #
      # False positives inside `src/` are suppressed per-line with `# nosemgrep: <rule-id>`
      # -- see `src/all2md/renderers/jinja.py:489`.
      - name: Run Semgrep
        run: |
          semgrep scan \
            --config p/python \
            --config p/security-audit \
            --error \
            --metrics off \
            src/

  security-bandit:
    name: Security Scan (Bandit)
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install Bandit
        run: |
          python -m pip install --upgrade pip
          pip install bandit[toml]

      - name: Run Bandit
        run: |
          bandit -c pyproject.toml -r src/

  release:
    name: Create GitHub Release
    # On tag push, after all CI checks pass: verify the version, build the
    # package as a sanity check, and create a GitHub Release for the notes.
    # The PyPI publish is handled by `release.yml` (the workflow registered
    # with PyPI's trusted publisher), which triggers via `workflow_run` when
    # this CI run completes successfully — so publishing is gated on CI.
    # (The Release created here uses GITHUB_TOKEN, whose `release: published`
    # event would not start release.yml anyway.)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint-and-typecheck, docs, test, test-windows, roundtrip, startup, security-semgrep, security-bandit]
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build hatchling

      - name: Verify version matches tag
        run: |
          PROJECT_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          RELEASE_VERSION="${GITHUB_REF_NAME#v}"
          echo "Project version: $PROJECT_VERSION"
          echo "Release version: $RELEASE_VERSION"
          if [ "$PROJECT_VERSION" != "$RELEASE_VERSION" ]; then
            echo "Error: pyproject.toml version ($PROJECT_VERSION) does not match tag ($RELEASE_VERSION)"
            exit 1
          fi
          # The MCPB bundle version is bumpversion-managed; verify it kept in
          # sync so we never ship a stale-versioned .mcpb.
          MCPB_VERSION=$(python -c "import json; print(json.load(open('mcpb/manifest.json'))['version'])")
          echo "MCPB manifest version: $MCPB_VERSION"
          if [ "$MCPB_VERSION" != "$RELEASE_VERSION" ]; then
            echo "Error: mcpb/manifest.json version ($MCPB_VERSION) does not match tag ($RELEASE_VERSION)"
            echo "Run 'bumpversion' to sync it (see [tool.bumpversion] in pyproject.toml)."
            exit 1
          fi

      - name: Build package
        run: python -m build

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Build MCPB bundle
        # Package the built-in MCP server as a .mcpb for one-click install in
        # Claude Desktop. The bundle only declares `all2md` as a dependency
        # (resolved by uv on the user's machine at install time), so packing
        # before the PyPI publish in release.yml is fine. Pin the CLI version
        # for reproducible releases — bump deliberately after testing locally.
        run: |
          npm install -g @anthropic-ai/mcpb@2.1.2
          mcpb validate mcpb/manifest.json
          mcpb pack mcpb all2md.mcpb

      - name: Create GitHub Release
        run: gh release create "$GITHUB_REF_NAME" --generate-notes all2md.mcpb
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
